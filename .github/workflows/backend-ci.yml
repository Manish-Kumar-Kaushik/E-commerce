name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run index review
        run: npm run index:review
        env:
          INDEX_REVIEW_MAX_EXECUTION_MS: '50'
          INDEX_REVIEW_MAX_DOCS_EXAMINED_PER_RETURNED_DOC: '10'
          INDEX_REVIEW_MAX_DOCS_EXAMINED_WITHOUT_RESULTS: '100'
